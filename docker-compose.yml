version: "3"
services:
  dev:
    image: node:18-alpine          # ← これだけで Node と npm が入る
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev -- --host --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./nakajimap:/app:cached           # ソースをマウント
      - /app/node_modules          # node_modules をコンテナ側に保持
    environment:
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=100
      - VITE_APIKEY=${VITE_APIKEY}
      - VITE_APP_ID=${VITE_APP_ID}
      - VITE_AUTHDOMAIN=${VITE_AUTHDOMAIN}
      - VITE_DATABASEURL=${VITE_DATABASEURL}
      - VITE_GOOGLEMAP_API_KEY=${VITE_GOOGLEMAP_API_KEY}
      - VITE_MESSAGING_SENDER_ID=${VITE_MESSAGING_SENDER_ID}
      - VITE_MEASUREMENT_ID=${VITE_MEASUREMENT_ID}
      - VITE_PROJECT_ID=${VITE_PROJECT_ID}
      - VITE_STORAGE_BUCKET=${VITE_STORAGE_BUCKET}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLEMAP_API_KEY: ${VITE_GOOGLEMAP_API_KEY}
    ports:
      - 8080:80
    environment:
      - VITE_APIKEY=${VITE_APIKEY}
      - VITE_APP_ID=${VITE_APP_ID}
      - VITE_AUTHDOMAIN=${VITE_AUTHDOMAIN}
      - VITE_DATABASEURL=${VITE_DATABASEURL}
      - VITE_GOOGLEMAP_API_KEY=${VITE_GOOGLEMAP_API_KEY}
      - VITE_MESSAGING_SENDER_ID=${VITE_MESSAGING_SENDER_ID}
      - VITE_MEASUREMENT_ID=${VITE_MEASUREMENT_ID}
      - VITE_PROJECT_ID=${VITE_PROJECT_ID}
      - VITE_STORAGE_BUCKET=${VITE_STORAGE_BUCKET}
    volumes:
      - ./nakajimap/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # ② 追加: PHP + Apache  (バックエンド API 用)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./nakajimap/dist:/var/www/html 
      - ./nakajimap/api:/var/www/html/api
      - ./apache/vhost.conf:/etc/apache2/sites-enabled/000-default.conf
    depends_on:
      - db
    ports:
      - "8081:80" # 例: PHP API をローカル 8081 に公開
    environment:
      - DB_HOST=db
      - DB_NAME=shop_app
      - DB_USER=shopuser
      - DB_PASS=secretpass

  # ③ 追加: MariaDB
  db:
    image: mariadb:11
    container_name: lamp_db
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: shop_app
      MARIADB_USER: shopuser
      MARIADB_PASSWORD: secretpass
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
