server {
  listen 80;
  server_name _;

  # React のビルド成果物が置かれるディレクトリ
  root /usr/share/nginx/html;
  index index.html;

  # ──── SPA フォールバック ───────────────────
  location / {
    # 1) 実ファイルがあれば返す
    # 2) ディレクトリがあればその下の index.html
    # 3) どちらも無ければ一律 index.html
    try_files $uri $uri/ /index.html;
  }
  # ──────────────────────────────────────────

  # API リクエストは PHP コンテナへプロキシ
  location /api/ {
    proxy_pass http://api:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # JS/CSS はキャッシュヘッダーをつける例
  location ~* \.(?:js|css|map)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
